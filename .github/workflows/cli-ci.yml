name: CLI CI

on:
  pull_request:
    paths:
      - "apps/cli/**"
      - "packages/sync-client/**"
      - "packages/vault-crypto/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "LICENSE"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/release-cli.yml"
  push:
    paths:
      - "apps/cli/**"
      - "packages/sync-client/**"
      - "packages/vault-crypto/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "LICENSE"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/release-cli.yml"

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.13.0
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/cli typecheck
      - run: pnpm -C apps/cli test --run
      - run: pnpm -C apps/cli test:package

  release-dry-run:
    needs: cli
    uses: ./.github/workflows/release-cli.yml
