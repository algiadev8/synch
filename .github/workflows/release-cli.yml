name: Release CLI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm after verification (upstream main only)"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate stable release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("apps/cli/package.json", "utf8"));
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error("Release CLI requires a stable x.y.z version.");
            }
          '
      - run: pnpm -C apps/cli test --run
      - name: Pack release
        run: pnpm -C apps/cli pack --pack-destination release
      - name: Verify release archive
        working-directory: apps/cli
        run: pnpm test:package release/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: synch-cli-package
          path: apps/cli/release/*.tgz
          if-no-files-found: error

  verify-publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: synch-cli-package
          path: release
      - name: Dry-run publish of downloaded artifact
        run: pnpm publish release/*.tgz --access public --no-git-checks --dry-run

  publish:
    needs: verify-publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'hjinco/synch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-cli
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: synch-cli-package
          path: release
      - name: Publish verified package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Configure NPM_TOKEN in the npm-cli environment."; exit 1; }
          pnpm publish release/*.tgz --access public --no-git-checks
