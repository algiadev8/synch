name: Release CLI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hjinco/synch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-cli
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate stable release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("apps/cli/package.json", "utf8"));
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error("Release CLI requires a stable x.y.z version.");
            }
          '
      - run: pnpm -C apps/cli test --run
      - run: pnpm -C apps/cli test:package
      - name: Pack release
        run: pnpm -C apps/cli pack --pack-destination release
      - uses: actions/upload-artifact@v4
        with:
          name: synch-cli-package
          path: apps/cli/release/*.tgz
          if-no-files-found: error
      - name: Publish verified package
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "Configure NPM_TOKEN in the npm-cli environment."; exit 1; }
          pnpm publish release/*.tgz --access public --no-git-checks
